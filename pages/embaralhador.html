<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://emoji-css.afeld.me/emoji.css" rel="stylesheet">
    <title>Seleção de times</title>
    <style>
        /* --- CSS ORIGINAL REESTRUTURADO E RESPONSIVO --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 10px;
        }

        /* Container Principal Fluido */
        .container {
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 20px auto;
            justify-content: center;
            gap: 15px;
        }

        #title-sort {
            color: white;
            font-size: 2rem;
        }

        /* Logo adaptável */
        .logo-zueira {
            width: 100%;
            max-width: 250px;
            height: auto;
        }

        /* Nova área de configuração dos inputs (Qtd de times / Jogadores) */
        .inputs-config {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 440px;
            margin-top: 10px;
        }

        .inputs-config label {
            color: white;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            flex: 1;
        }

        .inputs-config input {
            width: 100%;
            max-width: 90px;
            padding: 8px;
            margin-top: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #222;
            color: white;
        }

        /* TextArea de Entrada Principal */
        .container .textA {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: center;
        }

        .container .textA textarea {
            width: 100%;
            min-height: 180px;
            max-height: 250px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }

        /* Textos gerais */
        .container p {
            color: rgb(255, 255, 255);
            font-size: 18px;
        }

        #frase {
            font-size: 12px;
            color: #bbb;
        }

        /* Botão Principal */
        .container .but-embaralhar button {
            text-decoration: none;
            padding: 10px 20px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 8px;
            background-color: gray;
            color: white;
            margin-bottom: 15px;
            margin-top: 15px;
            border: 1px solid transparent;
            transition: 0.3s ease;
            width: 100%;
            max-width: 260px;
        }

        .container .but-embaralhar button:hover {
            background-color: white;
            color: gray;
            border: 1px solid gray;
        }

        /* Botão de Reset */
        #refresh {
            background-color: white;
            color: black;
            font-weight: bold;
            width: 140px;
            height: 35px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #refresh:hover {
            background-color: gray;
            color: white;
            border: 1px solid white;
        }

        /* Área Dinâmica de exibição dos times */
        .times {
            display: flex;
            flex-wrap: wrap;
            /* Mágica para quebrar linha se faltar espaço */
            width: 100%;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 30px;
            gap: 20px;
            align-items: flex-start;
        }

        .times_class {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 200px;
            max-width: 220px;
        }

        .times label {
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .times textarea {
            width: 100%;
            min-height: 150px;
            max-height: 250px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #bbb;
            background-color: #f9f9f9;
            box-sizing: border-box;
            font-size: 14px;
            text-align: center;
        }

        /* Destaque visual exclusivo para a caixinha das sobras */
        .sobras textarea {
            background-color: #ffdddd !important;
            border: 2px dashed #cc0000 !important;
            color: #770000;
        }

        /* Classe de controle do seu script */
        .active {
            display: none;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: black;
            background-color: white;
            width: 100vw;
            padding: 10px 0;
            margin-top: auto;
        }

        #frase {
            font-size: 12px;
            color: #555555;
        }

        /* --- MEDIA QUERIES REVISADOS --- */
        @media screen and (max-width: 768px) {
            .container h1 {
                font-size: 1.6em;
            }

            .container p {
                font-size: 14px;
            }

            .times_class {
                max-width: 45%;
                /* Fica em duas colunas no tablet */
            }
        }

        @media screen and (max-width: 480px) {
            .container .textA {
                width: 90%;
            }

            .inputs-config {
                width: 90%;
            }

            .times_class {
                max-width: 100%;
                /* Ocupa a tela cheia no mobile */
                width: 100%;
            }

            .container p,
            #frase {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="title-sort">Sorteador de Times</h1>

        <div>
            <img class="logo-zueira" src="../img/logo.png" alt="">
        </div>

        <div class="inputs-config">
            <label>
                Qtd de Times
                <input type="number" id="qtd_times" min="1" value="3">
            </label>
            <label>
                Jogadores por Time
                <input type="number" id="jogadores_por_time" min="1" value="7">
            </label>
        </div>

        <div class="textA">
            <textarea name="emb" id="emb" placeholder="Um nome em cada linha... "></textarea>
        </div>

        <div class="but-embaralhar" id="create1">
            <button onclick="embaralhar()">Sortear times</button>
        </div>

        <div class="times" id="time" style="display: none;"></div>

        <div>
            <button id="refresh">Novo sorteio</button>
        </div>
    </div>

    <footer>
        <p id="frase">Desenvolvido por <strong>MaiaTech Solution</strong></p>
    </footer>
</body>

<script>
    function embaralhar() {
        var qtdTimes = parseInt(document.getElementById('qtd_times').value) || 1;
        var jogPorTime = parseInt(document.getElementById('jogadores_por_time').value) || 1;
        var text_area = document.getElementById("emb").value.trim();

        if (!text_area) {
            alert("Por favor, insira os nomes dos jogadores antes de sortear.");
            return;
        }

        var element = document.getElementById('create1');
        if (element) element.classList.add('active');

        var containerTimes = document.getElementById("time");
        containerTimes.style.display = 'flex';
        containerTimes.innerHTML = "";

        var lista_geral = text_area.split("\n").map(nome => nome.trim()).filter(nome => nome !== "");

        function shuffle(o) {
            for (var j, x, i = o.length; i; j = Math.floor(Math.random() * i), x = o[--i], o[i] = o[j], o[j] = x);
            return o;
        }

        var lista_embaralhada = shuffle(lista_geral);
        var ponteiro = 0;

        // Distribuição padrão dos times configurados
        for (var t = 1; t <= qtdTimes; t++) {
            var jogadoresDoTime = [];

            for (var j = 0; j < jogPorTime; j++) {
                if (ponteiro < lista_embaralhada.length) {
                    jogadoresDoTime.push(lista_embaralhada[ponteiro]);
                    ponteiro++;
                }
            }

            if (jogadoresDoTime.length === 0 && t > 1) {
                break;
            }

            var divTime = document.createElement("div");
            divTime.className = "times_class";

            var label = document.createElement("label");
            label.innerText = "Time " + t + " (" + jogadoresDoTime.length + ")";

            var textarea = document.createElement("textarea");
            textarea.readOnly = true;
            textarea.value = jogadoresDoTime.join("\n");

            divTime.appendChild(label);
            divTime.appendChild(textarea);
            containerTimes.appendChild(divTime);
        }

        // NOVIDADE: Verifica se restou algum jogador que não coube nos times estruturados
        if (ponteiro < lista_embaralhada.length) {
            var sobras = [];
            while (ponteiro < lista_embaralhada.length) {
                sobras.push(lista_embaralhada[ponteiro]);
                ponteiro++;
            }

            // Cria um card exclusivo no final com estilo de alerta (vermelho/tracejado)
            var divSobras = document.createElement("div");
            divSobras.className = "times_class sobras"; // Usa a nova classe CSS '.sobras'

            var labelSobras = document.createElement("label");
            labelSobras.style.color = "#ff6666";
            labelSobras.innerText = "Próximos / Sobras (" + sobras.length + ")";

            var textareaSobras = document.createElement("textarea");
            textareaSobras.readOnly = true;
            textareaSobras.value = sobras.join("\n");

            divSobras.appendChild(labelSobras);
            divSobras.appendChild(textareaSobras);
            containerTimes.appendChild(divSobras);
        }
    }

    var btn = document.querySelector("#refresh");
    btn.addEventListener("click", function () {
        location.reload();
    });
</script>

</html>
